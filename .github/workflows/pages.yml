name: Deploy static portfolio
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Rebuilds site/data/pulse.json from the published releases of sast-triage and
      # sca-triage. If that cannot be done, the committed file is deployed as it is.
      - name: Build the release pulse data
        continue-on-error: true
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/build_pulse.py site
      # Writes the current versions into the labels the pages mark with data-release:
      # sast-triage from the pulse data above, sca-triage from the npm registry. A label
      # that cannot be filled is deployed with its committed text.
      - name: Fill the version labels
        continue-on-error: true
        timeout-minutes: 2
        run: python3 .github/scripts/build_versions.py site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  # A separate job, as GitHub documents: it starts after the artifact is stored.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
