name: Site checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: check site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check HTML, links, images and sitemap
        run: python3 .github/scripts/check_site.py site
      - name: Run the unit tests of the site scripts
        run: |
          python3 .github/scripts/test_check_site.py
          python3 .github/scripts/test_build_pulse.py
          python3 .github/scripts/test_build_versions.py
  sast-triage:
    name: sast-triage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0 # the base branch's history, which the pull request scan compares with
      # On a pull request the Action compares with the base branch and fails only on a new P1 finding.
      # On a push to main it scans the whole tree, where every finding counts as new.
      - name: Scan the site's code with sast-triage
        uses: lansiquo/sast-triage@7de5f487e1f936666fbfaec4833dd3dd6f32cf80 # v2.6.2
