name: Site checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: check site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check HTML, links, images and sitemap
        run: python3 .github/scripts/check_site.py site
      - name: Run the unit tests of the site scripts
        run: |
          python3 .github/scripts/test_check_site.py
          python3 .github/scripts/test_build_pulse.py
